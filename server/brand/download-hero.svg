<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Sarabun, Inter, sans-serif">
  <!-- ต้นฉบับภาพ download-hero.png (แปลงด้วย sharp + ฟอนต์ Sarabun เพื่อให้ตัวอักษรไทยขึ้นทุกเครื่อง) -->
  <!-- ภาพประกอบหน้าดาวน์โหลด: โน้ตบุ๊ก + มือถือที่เปิดแชท AranChat (ใช้ในหน้า login / หน้าแชท / หน้าดาวน์โหลด) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B3FD9"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F5FC"/><stop offset="1" stop-color="#F1EEF9"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1A0F4D" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="640" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="560" cy="40" r="120" fill="#fff" opacity=".07"/>
  <circle cx="60" cy="330" r="110" fill="#fff" opacity=".06"/>
  <circle cx="120" cy="60" r="6" fill="#fff" opacity=".5"/>
  <circle cx="590" cy="290" r="5" fill="#fff" opacity=".5"/>
  <circle cx="520" cy="110" r="3" fill="#fff" opacity=".6"/>

  <!-- โน้ตบุ๊ก -->
  <g filter="url(#sh)">
    <rect x="96" y="70" width="350" height="216" rx="14" fill="#1E293B"/>
    <rect x="106" y="80" width="330" height="196" rx="6" fill="url(#scr)"/>
    <path d="M60 286h422l-18 22H78z" fill="#CBD5E1"/>
    <rect x="236" y="286" width="70" height="6" rx="3" fill="#94A3B8"/>
  </g>
  <!-- หน้าจอแชทในโน้ตบุ๊ก -->
  <rect x="106" y="80" width="26" height="196" fill="#2E1F7A"/>
  <circle cx="119" cy="96" r="7" fill="#fff" opacity=".9"/>
  <circle cx="119" cy="118" r="6" fill="#fff" opacity=".35"/>
  <circle cx="119" cy="136" r="6" fill="#fff" opacity=".35"/>
  <rect x="132" y="80" width="96" height="196" fill="#fff"/>
  <g fill="#8B5CF6"><circle cx="146" cy="100" r="8"/><circle cx="146" cy="128" r="8" fill="#F59E0B"/><circle cx="146" cy="156" r="8" fill="#6366F1"/><circle cx="146" cy="184" r="8" fill="#EF4444"/></g>
  <g fill="#CBD5E1"><rect x="160" y="95" width="52" height="5" rx="2.5" fill="#334155"/><rect x="160" y="104" width="40" height="4" rx="2"/>
    <rect x="160" y="123" width="46" height="5" rx="2.5" fill="#334155"/><rect x="160" y="132" width="56" height="4" rx="2"/>
    <rect x="160" y="151" width="50" height="5" rx="2.5" fill="#334155"/><rect x="160" y="160" width="36" height="4" rx="2"/>
    <rect x="160" y="179" width="42" height="5" rx="2.5" fill="#334155"/><rect x="160" y="188" width="50" height="4" rx="2"/></g>
  <rect x="136" y="114" width="88" height="0.8" fill="#E2E8F0"/>
  <rect x="240" y="96" width="110" height="22" rx="11" fill="#fff"/>
  <rect x="250" y="104" width="80" height="6" rx="3" fill="#94A3B8"/>
  <rect x="300" y="128" width="122" height="22" rx="11" fill="#E4DCFD"/>
  <rect x="310" y="136" width="96" height="6" rx="3" fill="#5B3FD9" opacity=".6"/>
  <rect x="240" y="160" width="140" height="56" rx="12" fill="#fff"/>
  <rect x="240" y="160" width="140" height="16" rx="8" fill="#5B3FD9"/>
  <rect x="248" y="166" width="54" height="5" rx="2.5" fill="#fff"/>
  <rect x="248" y="184" width="110" height="6" rx="3" fill="#334155"/>
  <rect x="248" y="196" width="82" height="5" rx="2.5" fill="#CBD5E1"/>
  <rect x="240" y="250" width="186" height="18" rx="9" fill="#fff" stroke="#E2E8F0"/>
  <circle cx="416" cy="259" r="6" fill="#8B5CF6"/>

  <!-- มือถือ -->
  <g filter="url(#sh)">
    <rect x="430" y="96" width="132" height="246" rx="22" fill="#0F172A"/>
    <rect x="438" y="104" width="116" height="230" rx="16" fill="url(#scr)"/>
  </g>
  <rect x="478" y="110" width="36" height="7" rx="3.5" fill="#0F172A"/>
  <rect x="438" y="122" width="116" height="30" fill="#5B3FD9"/>
  <circle cx="454" cy="137" r="8" fill="#fff"/>
  <path d="M450 134h8M450 138h5" stroke="#5B3FD9" stroke-width="2" stroke-linecap="round"/>
  <rect x="468" y="132" width="56" height="5" rx="2.5" fill="#fff"/>
  <rect x="468" y="140" width="36" height="4" rx="2" fill="#fff" opacity=".6"/>
  <!-- การ์ดแจ้งเตือนบนมือถือ -->
  <rect x="446" y="162" width="100" height="72" rx="12" fill="#fff"/>
  <path d="M446 174a12 12 0 0 1 12-12h76a12 12 0 0 1 12 12v8h-100z" fill="#8B5CF6"/>
  <text x="456" y="178" font-size="10" font-weight="700" fill="#fff">แจ้งเตือนใหม่</text>
  <rect x="454" y="192" width="80" height="6" rx="3" fill="#334155"/>
  <rect x="454" y="204" width="64" height="5" rx="2.5" fill="#CBD5E1"/>
  <rect x="454" y="216" width="72" height="5" rx="2.5" fill="#CBD5E1"/>
  <rect x="476" y="244" width="70" height="20" rx="10" fill="#E4DCFD"/>
  <rect x="484" y="251" width="52" height="6" rx="3" fill="#5B3FD9" opacity=".6"/>
  <rect x="446" y="272" width="74" height="20" rx="10" fill="#fff"/>
  <rect x="454" y="279" width="54" height="6" rx="3" fill="#94A3B8"/>
  <rect x="446" y="306" width="100" height="18" rx="9" fill="#fff" stroke="#E2E8F0"/>

  <!-- ป้ายแจ้งเตือนลอย -->
  <g filter="url(#sh)">
    <rect x="368" y="40" width="150" height="40" rx="20" fill="#fff"/>
  </g>
  <circle cx="390" cy="60" r="12" fill="#EF4444"/>
  <text x="390" y="64.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="410" y="65" font-size="13" font-weight="700" fill="#2E1F7A">ข้อความใหม่</text>
</svg>
